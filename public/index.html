<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S. // Stark Core Holographic UI</title>
    <style>
        :root {
            --bg-color: #030712;
            --panel-bg: rgba(3, 15, 30, 0.9);
            --neon-cyan: #00f0ff;
            --neon-magenta: #ff007f;
            --neon-glow: rgba(0, 240, 255, 0.5);
            --border-color: rgba(0, 240, 255, 0.35);
            --text-main: #e0f7fc;
            --text-dim: #7fbcd2;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            background-image: radial-gradient(circle at 50% 50%, #061e38 0%, #02060d 100%);
        }

        header {
            height: 55px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            background: var(--panel-bg);
            box-shadow: 0 0 15px rgba(0,240,255,0.15);
        }

        header h1 {
            font-size: 1.1rem;
            letter-spacing: 2px;
            color: var(--neon-cyan);
            text-shadow: 0 0 8px var(--neon-cyan);
        }

        .main-grid {
            display: grid;
            grid-template-columns: 360px 1fr 380px;
            flex: 1;
            gap: 15px;
            padding: 15px;
            overflow: hidden;
        }

        .panel {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            padding: 15px;
            box-shadow: inset 0 0 20px rgba(0,240,255,0.06);
            position: relative;
        }

        .panel-title {
            font-size: 0.85rem;
            color: var(--neon-cyan);
            letter-spacing: 1px;
            margin-bottom: 12px;
            text-transform: uppercase;
            border-bottom: 1px dashed var(--border-color);
            padding-bottom: 6px;
        }

        /* PAINEL ESQUERDO: HOLOGRAFIA DA MULHER DANÇANDO (CANVAS) */
        .holo-projector-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            background: radial-gradient(circle, rgba(0,240,255,0.1) 0%, #02060d 80%);
            border-radius: 8px;
            margin: 5px 0;
            border: 1px solid var(--border-color);
            overflow: hidden;
            min-height: 280px;
        }

        #dancerCanvas {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }

        .holo-controls {
            display: flex;
            gap: 5px;
            margin-top: 8px;
            justify-content: center;
            z-index: 2;
        }

        .holo-controls button {
            font-size: 0.65rem;
            padding: 4px 8px;
        }

        .jarvis-status-text {
            font-size: 0.72rem;
            color: var(--neon-cyan);
            margin-top: 6px;
            text-align: center;
            z-index: 2;
            text-shadow: 0 0 5px var(--neon-cyan);
        }

        /* CHAT CENTER */
        .chat-box {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-right: 5px;
            margin-bottom: 10px;
        }

        .message {
            padding: 10px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            line-height: 1.4;
            max-width: 85%;
        }

        .message.jarvis {
            background: rgba(0, 240, 255, 0.08);
            border-left: 3px solid var(--neon-cyan);
            align-self: flex-start;
        }

        .message.user {
            background: rgba(138, 43, 226, 0.15);
            border-right: 3px solid #8a2be2;
            align-self: flex-end;
            color: #d8b4fe;
        }

        .input-area {
            display: flex;
            gap: 6px;
        }

        input[type="text"] {
            flex: 1;
            background: rgba(0,10,20,0.85);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 10px;
            color: var(--text-main);
            outline: none;
        }

        input[type="text"]:focus {
            border-color: var(--neon-cyan);
            box-shadow: 0 0 8px var(--neon-glow);
        }

        button {
            background: rgba(0,240,255,0.15);
            border: 1px solid var(--neon-cyan);
            color: var(--neon-cyan);
            padding: 0 14px;
            border-radius: 4px;
            cursor: pointer;
            transition: 0.2s;
            font-weight: bold;
            font-size: 0.8rem;
        }

        button:hover {
            background: var(--neon-cyan);
            color: var(--bg-color);
            box-shadow: 0 0 10px var(--neon-cyan);
        }

        .mic-btn.listening {
            background: #ff3333 !important;
            border-color: #ff6666 !important;
            color: #fff !important;
            box-shadow: 0 0 12px #ff3333;
        }

        /* MEDIA & PLAYER (RIGHT) */
        .media-section {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .folder-select, .url-input-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        label {
            font-size: 0.72rem;
            color: var(--text-dim);
        }

        select, .custom-input {
            background: rgba(0,10,20,0.85);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 7px;
            border-radius: 4px;
            font-size: 0.78rem;
            outline: none;
        }

        .player-screen {
            width: 100%;
            height: 160px;
            background: #000;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .player-screen iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .player-controls {
            display: flex;
            justify-content: space-between;
            gap: 5px;
        }

        .player-controls button {
            flex: 1;
            padding: 7px 0;
            font-size: 0.72rem;
        }

        .track-info {
            font-size: 0.75rem;
            color: var(--neon-cyan);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
    </style>
</head>
<body>

    <header>
        <h1>JARVIS // STARK CORE v4.2</h1>
        <div style="font-size: 0.75rem; color: var(--neon-cyan);">ESTADO: OPERACIONAL</div>
    </header>

    <div class="main-grid">
        <!-- PAINEL ESQUERDO: HOLOGRAFIA DA MULHER DANÇANDO -->
        <div class="panel">
            <div class="panel-title">Holograma 3D // Dançarina Sensual</div>
            <div class="holo-projector-container">
                <canvas id="dancerCanvas"></canvas>
            </div>
            <div class="jarvis-status-text" id="jarvisStatusText">Coreógrafo Holográfico Ativo</div>
            <div class="holo-controls">
                <button onclick="setDanceMode('synthwave')">⚡ Synthwave</button>
                <button onclick="setDanceMode('sensual')">✨ Sensual Wave</button>
                <button onclick="setDanceMode('club')">🔥 Club Beat</button>
            </div>
            <div style="margin-top: 8px; text-align: center;">
                <button id="clearMemoryBtn" style="font-size: 0.7rem; padding: 4px 10px;">Limpar Memória</button>
            </div>
        </div>

        <!-- PAINEL CENTRAL: NÚCLEO DE INTELIGÊNCIA & DIÁLOGO -->
        <div class="panel">
            <div class="panel-title">Núcleo de Inteligência & Memória Ilimitada</div>
            <div class="chat-box" id="chatBox"></div>
            <div class="input-area">
                <input type="text" id="promptInput" placeholder="Digite seu comando para o J.A.R.V.I.S...." autocomplete="off">
                <button id="micBtn" class="mic-btn" title="Comando por Voz">🎙️ Falar</button>
                <button id="sendBtn">Enviar</button>
            </div>
        </div>

        <!-- PAINEL DIREITO: MULTIMÍDIA -->
        <div class="panel media-section">
            <div class="panel-title">Controle de Mídia & Playlists</div>
            
            <div class="folder-select">
                <label>Pasta / Playlist Atual</label>
                <select id="folderSelect">
                    <option value="cyber">Cyberpunk & Synthwave (Ritmo Ágil)</option>
                    <option value="epic">Trilhas Épicas Stark (Ritmo Forte)</option>
                    <option value="relax">Foco & Concentração (Ritmo Suave)</option>
                </select>
            </div>

            <div class="url-input-group">
                <label>Link Editável (YouTube / Stream)</label>
                <div style="display: flex; gap: 5px;">
                    <input type="text" id="customUrlInput" class="custom-input" placeholder="Cole o link do YouTube aqui...">
                    <button id="loadUrlBtn">Carregar</button>
                </div>
            </div>

            <div class="player-screen" id="playerScreen">
                <div style="color: var(--text-dim); font-size: 0.78rem; text-align: center;">
                    Nenhuma mídia ativa
                </div>
            </div>

            <div class="track-info" id="trackInfo">Faixa: Aguardando seleção...</div>

            <div class="player-controls">
                <button id="prevBtn">⏮ Anterior</button>
                <button id="playPauseBtn">⏯ Play/Pause</button>
                <button id="nextBtn">⏭ Avançar</button>
            </div>
        </div>
    </div>

    <script>
        const chatBox = document.getElementById('chatBox');
        const promptInput = document.getElementById('promptInput');
        const sendBtn = document.getElementById('sendBtn');
        const micBtn = document.getElementById('micBtn');
        const clearMemoryBtn = document.getElementById('clearMemoryBtn');
        const jarvisStatusText = document.getElementById('jarvisStatusText');

        const folderSelect = document.getElementById('folderSelect');
        const customUrlInput = document.getElementById('customUrlInput');
        const loadUrlBtn = document.getElementById('loadUrlBtn');
        const playerScreen = document.getElementById('playerScreen');
        const trackInfo = document.getElementById('trackInfo');
        const nextBtn = document.getElementById('nextBtn');
        const prevBtn = document.getElementById('prevBtn');

        // Playlists
        const playlists = {
            cyber: [{title: "Synthwave Cyberpunk Mix", id: "4xDzrJKXOOY"}, {title: "Neon Horizon", id: "V9Pj2sbYJqw"}],
            epic: [{title: "Stark Orchestral Suite", id: "2S24-y0Ij3Y"}, {title: "Iron Protocol Theme", id: "7wtfhZwyrcc"}],
            relax: [{title: "Ambient Core Soundscapes", id: "5qap5aO4i9A"}, {title: "Stark Lab Atmosphere", id: "jfKfPfyJRdk"}],
        };

        let currentFolder = 'cyber';
        let currentIndex = 0;

        // Histórico de Conversa (LocalStorage)
        function loadChatHistory() {
            const history = JSON.parse(localStorage.getItem('jarvis_chat_history') || '[]');
            if (history.length === 0) {
                appendMessage('jarvis', 'Bom dia, senhor. O Stark Core está operacional. Como posso auxiliá-lo?');
            } else {
                history.forEach(msg => appendMessage(msg.sender, msg.text, false));
            }
        }

        function saveMessageToHistory(sender, text) {
            const history = JSON.parse(localStorage.getItem('jarvis_chat_history') || '[]');
            history.push({ sender, text });
            localStorage.setItem('jarvis_chat_history', JSON.stringify(history));
        }

        function appendMessage(sender, text, save = true) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${sender}`;
            msgDiv.innerText = text;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
            if (save) saveMessageToHistory(sender, text);
        }

        clearMemoryBtn.addEventListener('click', () => {
            if(confirm("Deseja apagar todo o registro de memória, senhor?")) {
                localStorage.removeItem('jarvis_chat_history');
                chatBox.innerHTML = '';
                appendMessage('jarvis', 'Memória redefinida com sucesso, senhor.');
                speakRobotVoice("Memória redefinida, senhor.");
            }
        });

        // Voz Robótica Masculina em PT-BR
        function speakRobotVoice(text) {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'pt-BR';
            utterance.rate = 1.05;
            utterance.pitch = 0.55;
            
            const voices = window.speechSynthesis.getVoices();
            const ptVoice = voices.find(v => v.lang.includes('pt') && (v.name.includes('Daniel') || v.name.includes('Google') || v.name.includes('Male') || v.name.includes('Antônio')));
            if (ptVoice) utterance.voice = ptVoice;

            window.speechSynthesis.speak(utterance);
        }

        // CANVAS HOLOGRÁFICO DA DANÇARINA SENSUAL DETALHADA
        const canvas = document.getElementById('dancerCanvas');
        const ctx = canvas.getContext('2d');
        let danceMode = 'synthwave';
        let animAngle = 0;

        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight - 40;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function setDanceMode(mode) {
            danceMode = mode;
            jarvisStatusText.innerText = `Modo Ativo: ${mode.toUpperCase()}`;
            speakRobotVoice(`Modo de dança alterado para ${mode}, senhor.`);
        }

        function drawHolographicDancer() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const cx = canvas.width / 2;
            const cy = canvas.height / 2 + 20;

            animAngle += (danceMode === 'club' ? 0.08 : danceMode === 'sensual' ? 0.04 : 0.06);

            // Efeito de grade holográfica de fundo
            ctx.strokeStyle = 'rgba(0, 240, 255, 0.08)';
            ctx.lineWidth = 1;
            for (let i = 0; i < canvas.height; i += 15) {
                ctx.beginPath();
                ctx.moveTo(0, i);
                ctx.lineTo(canvas.width, i);
                ctx.stroke();
            }

            // Parâmetros de ondulação corporal baseados na música
            const hipSway = Math.sin(animAngle * 2) * 12;
            const torsoTwist = Math.cos(animAngle) * 8;
            const armWave = Math.sin(animAngle * 1.5) * 20;

            ctx.save();
            ctx.translate(cx, cy);

            // Brilho Néon Holográfico
            ctx.shadowColor = danceMode === 'sensual' ? '#ff007f' : '#00f0ff';
            ctx.shadowBlur = 15;
            ctx.strokeStyle = danceMode === 'sensual' ? '#ff007f' : '#00f0ff';
            ctx.fillStyle = 'rgba(0, 240, 255, 0.15)';
            ctx.lineWidth = 2.5;

            // 1. Cabeça com Cabelos Esvoaçantes
            ctx.beginPath();
            ctx.arc(torsoTwist * 0.5, -75, 18, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            // Cabelos longos flutuando
            ctx.beginPath();
            ctx.moveTo(torsoTwist * 0.5 - 10, -85);
            ctx.quadraticCurveTo(torsoTwist - 35, -50, torsoTwist - 20 + hipSway * 0.5, -20);
            ctx.stroke();

            // 2. Tronco & Busto (Curvas Orgânicas Sensuais)
            ctx.beginPath();
            ctx.moveTo(-12, -55);
            ctx.quadraticCurveTo(-15 + torsoTwist, -25, -16 + hipSway * 0.5, 0); // Lado esquerdo
            ctx.lineTo(16 + hipSway * 0.5, 0); // Cintura / Quadris
            ctx.quadraticCurveTo(15 + torsoTwist, -25, 12, -55); // Lado direito
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // 3. Braços Dinâmicos
            // Braço Esquerdo
            ctx.beginPath();
            ctx.moveTo(-12, -50);
            ctx.quadraticCurveTo(-35 + armWave, -30, -20 + armWave * 0.8, -5);
            ctx.stroke();

            // Braço Direito
            ctx.beginPath();
            ctx.moveTo(12, -50);
            ctx.quadraticCurveTo(35 - armWave, -30, 20 - armWave * 0.8, -5);
            ctx.stroke();

            // 4. Pernas com Rebolado Fluido
            // Perna Esquerda
            ctx.beginPath();
            ctx.moveTo(-10 + hipSway * 0.5, 0);
            ctx.quadraticCurveTo(-18 + hipSway, 40, -12 + hipSway * 1.2, 80);
            ctx.stroke();

            // Perna Direita
            ctx.beginPath();
            ctx.moveTo(10 + hipSway * 0.5, 0);
            ctx.quadraticCurveTo(18 + hipSway, 40, 12 + hipSway * 1.2, 80);
            ctx.stroke();

            // Base do Emitidor Holográfico em Anel
            ctx.restore();
            ctx.strokeStyle = '#00f0ff';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.ellipse(cx, cy + 95, 60, 18, 0, 0, Math.PI * 2);
            ctx.stroke();
            ctx.fillStyle = 'rgba(0, 240, 255, 0.25)';
            ctx.fill();

            requestAnimationFrame(drawHolographicDancer);
        }
        drawHolographicDancer();

        // Carregar Mídia & Sincronizar com Pastas
        function loadTrack(videoId, title) {
            playerScreen.innerHTML = `<iframe src="https://www.youtube.com/embed/${videoId}?autoplay=1&enablejsapi=1" allow="autoplay"></iframe>`;
            trackInfo.innerText = `Faixa: ${title}`;
            
            if (currentFolder === 'cyber') setDanceMode('synthwave');
            else if (currentFolder === 'epic') setDanceMode('club');
            else setDanceMode('sensual');
        }

        folderSelect.addEventListener('change', (e) => {
            currentFolder = e.target.value;
            currentIndex = 0;
            const track = playlists[currentFolder][currentIndex];
            loadTrack(track.id, track.title);
        });

        nextBtn.addEventListener('click', () => {
            const list = playlists[currentFolder];
            currentIndex = (currentIndex + 1) % list.length;
            const track = list[currentIndex];
            loadTrack(track.id, track.title);
            speakRobotVoice("Avançando para a próxima faixa, senhor.");
        });

        prevBtn.addEventListener('click', () => {
            const list = playlists[currentFolder];
            currentIndex = (currentIndex - 1 + list.length) % list.length;
            const track = list[currentIndex];
            loadTrack(track.id, track.title);
            speakRobotVoice("Retornando à faixa anterior, senhor.");
        });

        loadUrlBtn.addEventListener('click', () => {
            const url = customUrlInput.value.trim();
            if(!url) return;
            let videoId = '';
            if(url.includes('youtu.be/')) {
                videoId = url.split('youtu.be/')[1].split('?')[0];
            } else if(url.includes('watch?v=')) {
                videoId = url.split('watch?v=')[1].split('&')[0];
            }
            if(videoId) {
                loadTrack(videoId, "Link Personalizado do YouTube");
                speakRobotVoice("Mídia externa carregada, senhor.");
            } else {
                alert("Por favor, insira um link válido do YouTube, senhor.");
            }
        });

        // Reconhecimento de Voz (Microfone)
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            const recognition = new SpeechRecognition();
            recognition.lang = 'pt-BR';
            recognition.continuous = false;
            recognition.interimResults = false;

            micBtn.addEventListener('click', () => {
                recognition.start();
                micBtn.classList.add('listening');
                jarvisStatusText.innerText = 'Ouvindo comando de voz...';
            });

            recognition.onresult = (event) => {
                const speechText = event.results[0][0].transcript;
                promptInput.value = speechText;
                micBtn.classList.remove('listening');
                sendCommand();
            };

            recognition.onerror = () => {
                micBtn.classList.remove('listening');
                jarvisStatusText.innerText = 'Erro na captação de voz';
            };

            recognition.onend = () => {
                micBtn.classList.remove('listening');
            };
        } else {
            micBtn.style.display = 'none';
        }

        // Comunicação com o Servidor /api/jarvis
        async function sendCommand() {
            const text = promptInput.value.trim();
            if (!text) return;

            appendMessage('user', text);
            promptInput.value = '';
            jarvisStatusText.innerText = 'Processando requisição...';

            try {
                const response = await fetch('/api/jarvis', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: text })
                });

                const data = await response.json();

                if (response.ok && data.response) {
                    appendMessage('jarvis', data.response);
                    jarvisStatusText.innerText = 'Respondendo ao senhor';
                    speakRobotVoice(data.response);
                    setTimeout(() => jarvisStatusText.innerText = 'Coreógrafo Holográfico Ativo', 4000);
                } else {
                    const errText = data.error || "Ocorreu um erro no núcleo, senhor.";
                    appendMessage('jarvis', errText);
                    jarvisStatusText.innerText = 'Atenção Requerida';
                    speakRobotVoice("Houve uma falha no processamento, senhor.");
                }

            } catch (err) {
                console.error(err);
                appendMessage('jarvis', "Falha de comunicação com o núcleo de inteligência, senhor.");
                jarvisStatusText.innerText = 'Erro de Conexão';
                speakRobotVoice("Falha de comunicação com o núcleo de inteligência, senhor.");
            }
        }

        sendBtn.addEventListener('click', sendCommand);
        promptInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendCommand();
        });

        // Inicialização
        window.addEventListener('load', () => {
            loadChatHistory();
            const initialTrack = playlists['cyber'][0];
            loadTrack(initialTrack.id, initialTrack.title);
        });
    </script>
</body>
</html>
