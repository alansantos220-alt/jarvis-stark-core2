<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S. // Stark Core Holographic UI</title>
    <style>
        :root {
            --bg-color: #030712;
            --panel-bg: rgba(3, 15, 30, 0.9);
            --neon-cyan: #00f0ff;
            --neon-glow: rgba(0, 240, 255, 0.5);
            --border-color: rgba(0, 240, 255, 0.35);
            --text-main: #e0f7fc;
            --text-dim: #7fbcd2;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            background-image: radial-gradient(circle at 50% 50%, #061e38 0%, #02060d 100%);
        }

        header {
            height: 55px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            background: var(--panel-bg);
            box-shadow: 0 0 15px rgba(0,240,255,0.15);
        }

        header h1 {
            font-size: 1.1rem;
            letter-spacing: 2px;
            color: var(--neon-cyan);
            text-shadow: 0 0 8px var(--neon-cyan);
        }

        .main-grid {
            display: grid;
            grid-template-columns: 340px 1fr 380px;
            flex: 1;
            gap: 15px;
            padding: 15px;
            overflow: hidden;
        }

        .panel {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            padding: 15px;
            box-shadow: inset 0 0 20px rgba(0,240,255,0.06);
            position: relative;
        }

        .panel-title {
            font-size: 0.85rem;
            color: var(--neon-cyan);
            letter-spacing: 1px;
            margin-bottom: 12px;
            text-transform: uppercase;
            border-bottom: 1px dashed var(--border-color);
            padding-bottom: 6px;
        }

        /* HOLOGRAPHIC JARVIS PROJECTOR (LEFT) */
        .holo-projector-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            background: radial-gradient(circle, rgba(0,240,255,0.12) 0%, transparent 75%);
            border-radius: 10px;
            margin: 5px 0;
            border: 1px solid var(--border-color);
            box-shadow: inset 0 0 30px rgba(0,240,255,0.1);
            overflow: hidden;
            min-height: 280px;
        }

        .hologram-beam {
            position: absolute;
            bottom: 0;
            width: 80px;
            height: 100%;
            background: linear-gradient(to top, rgba(0,240,255,0.4), transparent);
            clip-path: polygon(30% 100%, 70% 100%, 100% 0%, 0% 0%);
            animation: beamPulse 3s infinite alternate ease-in-out;
        }

        @keyframes beamPulse {
            0% { opacity: 0.4; transform: scaleX(0.95); }
            100% { opacity: 0.8; transform: scaleX(1.05); }
        }

        .jarvis-bust {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.4s ease;
        }

        /* Helmet Styling */
        .jarvis-helmet {
            font-size: 3.5rem;
            filter: drop-shadow(0 0 12px var(--neon-cyan));
            animation: helmetFloat 2.5s infinite alternate ease-in-out;
        }

        @keyframes helmetFloat {
            0% { transform: translateY(0px) rotate(0deg); }
            100% { transform: translateY(-6px) rotate(1deg); }
        }

        /* Arc Reactor Chest Core */
        .arc-reactor-core {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            border: 2px solid var(--neon-cyan);
            background: radial-gradient(circle, #fff 0%, var(--neon-cyan) 50%, #002244 100%);
            box-shadow: 0 0 20px var(--neon-cyan), inset 0 0 8px #fff;
            margin-top: 8px;
            animation: reactorPulse 1.2s infinite alternate;
        }

        @keyframes reactorPulse {
            0% { box-shadow: 0 0 10px var(--neon-cyan); transform: scale(0.95); }
            100% { box-shadow: 0 0 25px #fff, 0 0 15px var(--neon-cyan); transform: scale(1.05); }
        }

        .holo-base-emitter {
            width: 140px;
            height: 25px;
            border: 2px solid var(--neon-cyan);
            border-radius: 50%;
            margin-top: 15px;
            background: rgba(0,240,255,0.2);
            box-shadow: 0 0 15px var(--neon-cyan);
            z-index: 2;
        }

        .jarvis-status-text {
            font-size: 0.75rem;
            color: var(--neon-cyan);
            margin-top: 10px;
            text-align: center;
            z-index: 2;
            text-shadow: 0 0 5px var(--neon-cyan);
        }

        /* CHAT CENTER */
        .chat-box {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-right: 5px;
            margin-bottom: 10px;
        }

        .message {
            padding: 10px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            line-height: 1.4;
            max-width: 85%;
        }

        .message.jarvis {
            background: rgba(0, 240, 255, 0.08);
            border-left: 3px solid var(--neon-cyan);
            align-self: flex-start;
        }

        .message.user {
            background: rgba(138, 43, 226, 0.15);
            border-right: 3px solid #8a2be2;
            align-self: flex-end;
            color: #d8b4fe;
        }

        .input-area {
            display: flex;
            gap: 6px;
        }

        input[type="text"] {
            flex: 1;
            background: rgba(0,10,20,0.85);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 10px;
            color: var(--text-main);
            outline: none;
        }

        input[type="text"]:focus {
            border-color: var(--neon-cyan);
            box-shadow: 0 0 8px var(--neon-glow);
        }

        button {
            background: rgba(0,240,255,0.15);
            border: 1px solid var(--neon-cyan);
            color: var(--neon-cyan);
            padding: 0 14px;
            border-radius: 4px;
            cursor: pointer;
            transition: 0.2s;
            font-weight: bold;
            font-size: 0.8rem;
        }

        button:hover {
            background: var(--neon-cyan);
            color: var(--bg-color);
            box-shadow: 0 0 10px var(--neon-cyan);
        }

        .mic-btn.listening {
            background: #ff3333 !important;
            border-color: #ff6666 !important;
            color: #fff !important;
            box-shadow: 0 0 12px #ff3333;
        }

        /* MEDIA & DANCING 2D CHARACTER (RIGHT) */
        .media-section {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .folder-select, .url-input-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        label {
            font-size: 0.72rem;
            color: var(--text-dim);
        }

        select, .custom-input {
            background: rgba(0,10,20,0.85);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 7px;
            border-radius: 4px;
            font-size: 0.78rem;
            outline: none;
        }

        .player-screen {
            width: 100%;
            height: 140px;
            background: #000;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .player-screen iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .player-controls {
            display: flex;
            justify-content: space-between;
            gap: 5px;
        }

        .player-controls button {
            flex: 1;
            padding: 7px 0;
            font-size: 0.72rem;
        }

        .track-info {
            font-size: 0.75rem;
            color: var(--neon-cyan);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* DANCING 2D CHARACTER CONTAINER (BELOW PLAYER) */
        .dancer-container {
            flex: 1;
            background: radial-gradient(circle, rgba(0,240,255,0.08) 0%, rgba(2,6,13,0.9) 80%);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            min-height: 140px;
        }

        .dancer-avatar {
            font-size: 3.2rem;
            filter: drop-shadow(0 0 10px var(--neon-cyan));
            animation: danceIdle 1.5s infinite alternate ease-in-out;
        }

        @keyframes danceIdle {
            0% { transform: translateY(0px) rotate(-3deg); }
            100% { transform: translateY(-8px) rotate(3deg); }
        }

        @keyframes danceActive {
            0% { transform: translateY(0px) scale(1) rotate(-8deg); filter: drop-shadow(0 0 15px #00f0ff); }
            50% { transform: translateY(-12px) scale(1.1) rotate(8deg); filter: drop-shadow(0 0 25px #ff00ff); }
            100% { transform: translateY(0px) scale(1) rotate(-8deg); filter: drop-shadow(0 0 15px #00f0ff); }
        }

        .dancer-status {
            font-size: 0.7rem;
            color: var(--text-dim);
            margin-top: 4px;
            background: rgba(0,240,255,0.1);
            padding: 2px 8px;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <header>
        <h1>JARVIS // STARK CORE v4.0</h1>
        <div style="font-size: 0.75rem; color: var(--neon-cyan);">ESTADO: CONECTADO</div>
    </header>

    <div class="main-grid">
        <!-- PAINEL ESQUERDO: PROJEÇÃO HOLOGRÁFICA DO J.A.R.V.I.S. -->
        <div class="panel">
            <div class="panel-title">Projeção Holográfica // J.A.R.V.I.S.</div>
            <div class="holo-projector-container">
                <div class="hologram-beam"></div>
                <div class="jarvis-bust" id="jarvisBust">
                    <div class="jarvis-helmet" id="jarvisHelmet">🤖</div>
                    <div class="arc-reactor-core" id="arcReactor"></div>
                </div>
                <div class="holo-base-emitter"></div>
            </div>
            <div class="jarvis-status-text" id="jarvisStatusText">Núcleo Stark Ativo - Aguardando Comando</div>
            <div style="margin-top: 8px; text-align: center;">
                <button id="clearMemoryBtn" style="font-size: 0.7rem; padding: 4px 10px;">Limpar Memória</button>
            </div>
        </div>

        <!-- PAINEL CENTRAL: NÚCLEO DE INTELIGÊNCIA & DIÁLOGO -->
        <div class="panel">
            <div class="panel-title">Núcleo de Inteligência & Memória Ilimitada</div>
            <div class="chat-box" id="chatBox">
                <!-- Histórico carregado via localStorage -->
            </div>
            <div class="input-area">
                <input type="text" id="promptInput" placeholder="Digite seu comando para o J.A.R.V.I.S...." autocomplete="off">
                <button id="micBtn" class="mic-btn" title="Comando por Voz">🎙️ Falar</button>
                <button id="sendBtn">Enviar</button>
            </div>
        </div>

        <!-- PAINEL DIREITO: MULTIMÍDIA & BONECA 2D DANÇANDO -->
        <div class="panel media-section">
            <div class="panel-title">Controle de Mídia & Palco 2D</div>
            
            <div class="folder-select">
                <label>Pasta / Playlist Atual</label>
                <select id="folderSelect">
                    <option value="cyber">Cyberpunk & Synthwave</option>
                    <option value="epic">Trilhas Épicas Stark</option>
                    <option value="relax">Foco & Concentração</option>
                </select>
            </div>

            <div class="url-input-group">
                <label>Link Editável (YouTube / Stream)</label>
                <div style="display: flex; gap: 5px;">
                    <input type="text" id="customUrlInput" class="custom-input" placeholder="Cole o link do YouTube aqui...">
                    <button id="loadUrlBtn">Carregar</button>
                </div>
            </div>

            <div class="player-screen" id="playerScreen">
                <div style="color: var(--text-dim); font-size: 0.78rem; text-align: center;">
                    Nenhuma mídia ativa
                </div>
            </div>

            <div class="track-info" id="trackInfo">Faixa: Aguardando seleção...</div>

            <div class="player-controls">
                <button id="prevBtn">⏮ Anterior</button>
                <button id="playPauseBtn">⏯ Play/Pause</button>
                <button id="nextBtn">⏭ Avançar</button>
            </div>

            <!-- BONECA 2D DANÇANDO ABAIXO DO PLAYER -->
            <div class="dancer-container">
                <div class="dancer-avatar" id="dancerAvatar">💃</div>
                <div class="dancer-status" id="dancerStatus">Em Repouso</div>
            </div>
        </div>
    </div>

    <script>
        const chatBox = document.getElementById('chatBox');
        const promptInput = document.getElementById('promptInput');
        const sendBtn = document.getElementById('sendBtn');
        const micBtn = document.getElementById('micBtn');
        const clearMemoryBtn = document.getElementById('clearMemoryBtn');
        
        const jarvisBust = document.getElementById('jarvisBust');
        const jarvisHelmet = document.getElementById('jarvisHelmet');
        const arcReactor = document.getElementById('arcReactor');
        const jarvisStatusText = document.getElementById('jarvisStatusText');

        // Controles de Mídia & Dançarina
        const folderSelect = document.getElementById('folderSelect');
        const customUrlInput = document.getElementById('customUrlInput');
        const loadUrlBtn = document.getElementById('loadUrlBtn');
        const playerScreen = document.getElementById('playerScreen');
        const trackInfo = document.getElementById('trackInfo');
        const nextBtn = document.getElementById('nextBtn');
        const prevBtn = document.getElementById('prevBtn');
        const dancerAvatar = document.getElementById('dancerAvatar');
        const dancerStatus = document.getElementById('dancerStatus');

        // Playlists de Exemplo
        const playlists = {
            cyber: [{title: "Synthwave Cyberpunk Mix", id: "4xDzrJKXOOY"}, {title: "Neon Horizon", id: "V9Pj2sbYJqw"}],
            epic: [{title: "Stark Orchestral Suite", id: "2S24-y0Ij3Y"}, {title: "Iron Protocol Theme", id: "7wtfhZwyrcc"}],
            relax: [{title: "Ambient Core Soundscapes", id: "5qap5aO4i9A"}, {title: "Stark Lab Atmosphere", id: "jfKfPfyJRdk"}],
        };

        let currentFolder = 'cyber';
        let currentIndex = 0;

        // Memória Ilimitada no LocalStorage
        function loadChatHistory() {
            const history = JSON.parse(localStorage.getItem('jarvis_chat_history') || '[]');
            if (history.length === 0) {
                appendMessage('jarvis', 'Bom dia, senhor. O Stark Core está operacional. Como posso auxiliá-lo?');
            } else {
                history.forEach(msg => appendMessage(msg.sender, msg.text, false));
            }
        }

        function saveMessageToHistory(sender, text) {
            const history = JSON.parse(localStorage.getItem('jarvis_chat_history') || '[]');
            history.push({ sender, text });
            localStorage.setItem('jarvis_chat_history', JSON.stringify(history));
        }

        function appendMessage(sender, text, save = true) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${sender}`;
            msgDiv.innerText = text;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
            if (save) saveMessageToHistory(sender, text);
        }

        clearMemoryBtn.addEventListener('click', () => {
            if(confirm("Deseja apagar todo o registro de memória, senhor?")) {
                localStorage.removeItem('jarvis_chat_history');
                chatBox.innerHTML = '';
                appendMessage('jarvis', 'Memória redefinida com sucesso, senhor.');
                speakRobotVoice("Memória redefinida, senhor.");
            }
        });

        // Síntese de Voz Masculina Robótica em PT-BR
        function speakRobotVoice(text) {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'pt-BR';
            utterance.rate = 1.05;
            utterance.pitch = 0.55; // Tom grave metálico
            
            const voices = window.speechSynthesis.getVoices();
            const ptVoice = voices.find(v => v.lang.includes('pt') && (v.name.includes('Daniel') || v.name.includes('Google') || v.name.includes('Male') || v.name.includes('Antônio')));
            if (ptVoice) utterance.voice = ptVoice;

            window.speechSynthesis.speak(utterance);
        }

        // Animações Humanizadas Reativas do J.A.R.V.I.S.
        function setJarvisReaction(state, textStatus) {
            jarvisStatusText.innerText = textStatus;
            arcReactor.style.animation = '';
            jarvisBust.style.transform = 'translateY(0px)';
            void arcReactor.offsetWidth;

            if (state === 'thinking') {
                arcReactor.style.animation = 'reactorPulse 0.4s infinite alternate';
                jarvisBust.style.transform = 'scale(1.05)';
                jarvisHelmet.innerText = '🤔';
            } else if (state === 'talking') {
                arcReactor.style.animation = 'reactorPulse 0.8s infinite alternate';
                jarvisHelmet.innerText = '🗣️';
            } else if (state === 'listening') {
                arcReactor.style.animation = 'reactorPulse 0.6s infinite alternate';
                jarvisHelmet.innerText = '🎙️';
            } else {
                arcReactor.style.animation = 'reactorPulse 1.2s infinite alternate';
                jarvisHelmet.innerText = '🤖';
            }
        }

        // Carregar Mídia e Ativar Dança Rítmica da Personagem 2D
        function loadTrack(videoId, title) {
            playerScreen.innerHTML = `<iframe src="https://www.youtube.com/embed/${videoId}?autoplay=1&enablejsapi=1" allow="autoplay"></iframe>`;
            trackInfo.innerText = `Faixa: ${title}`;
            
            // Ativa animação de dança na personagem 2D
            dancerAvatar.style.animation = 'danceActive 0.6s infinite alternate ease-in-out';
            dancerStatus.innerText = 'Dançando no Ritmo 🎶';
        }

        folderSelect.addEventListener('change', (e) => {
            currentFolder = e.target.value;
            currentIndex = 0;
            const track = playlists[currentFolder][currentIndex];
            loadTrack(track.id, track.title);
        });

        nextBtn.addEventListener('click', () => {
            const list = playlists[currentFolder];
            currentIndex = (currentIndex + 1) % list.length;
            const track = list[currentIndex];
            loadTrack(track.id, track.title);
            speakRobotVoice("Avançando para a próxima faixa, senhor.");
        });

        prevBtn.addEventListener('click', () => {
            const list = playlists[currentFolder];
            currentIndex = (currentIndex - 1 + list.length) % list.length;
            const track = list[currentIndex];
            loadTrack(track.id, track.title);
            speakRobotVoice("Retornando à faixa anterior, senhor.");
        });

        loadUrlBtn.addEventListener('click', () => {
            const url = customUrlInput.value.trim();
            if(!url) return;
            let videoId = '';
            if(url.includes('youtu.be/')) {
                videoId = url.split('youtu.be/')[1].split('?')[0];
            } else if(url.includes('watch?v=')) {
                videoId = url.split('watch?v=')[1].split('&')[0];
            }
            if(videoId) {
                loadTrack(videoId, "Link Personalizado do YouTube");
                speakRobotVoice("Mídia externa carregada, senhor.");
            } else {
                alert("Por favor, insira um link válido do YouTube, senhor.");
            }
        });

        // Web Speech API para Comandos de Voz
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            const recognition = new SpeechRecognition();
            recognition.lang = 'pt-BR';
            recognition.continuous = false;
            recognition.interimResults = false;

            micBtn.addEventListener('click', () => {
                recognition.start();
                micBtn.classList.add('listening');
                setJarvisReaction('listening', 'Ouvindo comando de voz...');
            });

            recognition.onresult = (event) => {
                const speechText = event.results[0][0].transcript;
                promptInput.value = speechText;
                micBtn.classList.remove('listening');
                sendCommand();
            };

            recognition.onerror = () => {
                micBtn.classList.remove('listening');
                setJarvisReaction('normal', 'Erro na captação de voz');
            };

            recognition.onend = () => {
                micBtn.classList.remove('listening');
            };
        } else {
            micBtn.style.display = 'none';
        }

        // Comunicação com o Servidor /api/jarvis
        async function sendCommand() {
            const text = promptInput.value.trim();
            if (!text) return;

            appendMessage('user', text);
            promptInput.value = '';
            setJarvisReaction('thinking', 'Processando requisição...');

            try {
                const response = await fetch('/api/jarvis', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: text })
                });

                const data = await response.json();

                if (response.ok && data.response) {
                    appendMessage('jarvis', data.response);
                    setJarvisReaction('talking', 'Respondendo ao senhor');
                    speakRobotVoice(data.response);
                    setTimeout(() => setJarvisReaction('normal', 'Núcleo Stark Ativo'), 4000);
                } else {
                    const errText = data.error || "Ocorreu um erro no núcleo, senhor.";
                    appendMessage('jarvis', errText);
                    setJarvisReaction('normal', 'Atenção Requerida');
                    speakRobotVoice("Houve uma falha no processamento, senhor.");
                }

            } catch (err) {
                console.error(err);
                appendMessage('jarvis', "Falha de comunicação com o núcleo de inteligência, senhor.");
                setJarvisReaction('normal', 'Erro de Conexão');
                speakRobotVoice("Falha de comunicação com o núcleo de inteligência, senhor.");
            }
        }

        sendBtn.addEventListener('click', sendCommand);
        promptInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendCommand();
        });

        // Inicialização
        window.addEventListener('load', () => {
            loadChatHistory();
            const initialTrack = playlists['cyber'][0];
            loadTrack(initialTrack.id, initialTrack.title);
            setJarvisReaction('normal', 'Núcleo Stark Operacional');
        });
    </script>
</body>
</html>
